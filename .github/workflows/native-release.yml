name: Native geomtool release qualification

on:
  workflow_call:
    inputs:
      netgen_release:
        description: Immutable precise-simulation/netgen-sdk release to qualify
        required: false
        type: string
        default: netgen-sdk-2acc7e8443a4-r1
  workflow_dispatch:
    inputs:
      netgen_release:
        description: Immutable precise-simulation/netgen-sdk release to qualify
        required: false
        type: string
        default: netgen-sdk-2acc7e8443a4-r1
  pull_request:

permissions:
  contents: read

env:
  PRODUCER_IMAGE: quay.io/pypa/manylinux2014_x86_64
  PRODUCER_IMAGE_TAG: "2026.10.03-1"
  PRODUCER_IMAGE_DIGEST: sha256:ffd6d1f11237599748657996b750db6b3a5b724fea5a81cd9ea65add4f45b6c9
  CMAKE_VERSION: "3.31.6"

jobs:
  matrix:
    name: Load native release matrix
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Geomtool native contract
        run: python3 scripts/check_geomtool_contract.py

      - name: Load release contract
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(".github/native-release-matrix.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          include = data.get("include")
          if not isinstance(include, list) or not include:
              raise SystemExit(f"{path} must define a nonempty include array")
          print(json.dumps(data, separators=(",", ":")))
          PY
          )"
          echo "native=$matrix" >> "$GITHUB_OUTPUT"

  native:
    needs: matrix
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}

    steps:
      - name: Check out compatibility fixture
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/check_geomtool_contract.py \
            scripts/fetch_sdks.py \
            scripts/package_release.py \
            scripts/verify_package.py \
            tests/e2e.py

      - name: Download and verify designated SDKs
        id: sdk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETGEN_RELEASE: ${{ inputs.netgen_release || 'netgen-sdk-2acc7e8443a4-r1' }}
        run: |
          set -euo pipefail
          python scripts/fetch_sdks.py \
            --platform "${{ matrix.sdk }}" \
            --netgen-release "$NETGEN_RELEASE" \
            --output "${{ runner.temp }}/geomtool-sdks" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"

      - name: Select Xcode 16.4
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          developer=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$developer"
          sudo xcode-select -s "$developer"
          xcodebuild -version

      - name: Build, package, and qualify Linux variants
        if: matrix.platform == 'linux'
        shell: bash
        env:
          OCCT_ROOT_HOST: ${{ steps.sdk.outputs.occt_root }}
          NETGEN_DIR_HOST: ${{ steps.sdk.outputs.netgen_dir }}
          PACKAGE_BASE: ${{ matrix.package_base }}
          EXTENSION: ${{ matrix.extension }}
          STATIC_BUILD: ${{ matrix.static }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/geomtool-native"
          rm -rf "$work"
          mkdir -p "$work/assets"

          docker run --rm -i \
            -e CMAKE_VERSION \
            -e GITHUB_RUN_NUMBER \
            -e PACKAGE_BASE \
            -e EXTENSION \
            -e STATIC_BUILD \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$OCCT_ROOT_HOST:/deps/occt:ro" \
            -v "$NETGEN_DIR_HOST:/deps/netgen:ro" \
            -v "$work:/work" \
            "$PRODUCER_IMAGE:$PRODUCER_IMAGE_TAG@$PRODUCER_IMAGE_DIGEST" \
            bash -s <<'BASH'
          # manylinux2014 ships an older Bash where an empty array expansion
          # trips nounset. Keep fail-fast and pipeline checking without -u.
          set -eo pipefail
          python_bin=/opt/python/cp312-cp312/bin/python
          "$python_bin" -m pip install --disable-pip-version-check --quiet "cmake==$CMAKE_VERSION"
          export PATH="/opt/python/cp312-cp312/bin:$PATH"

          static_args=()
          if [[ "$STATIC_BUILD" == true ]]; then
            static_args+=(-DSTATIC=ON)
          fi

          build_variant() {
            local variant="$1"
            local instant="$2"
            local build="/work/build-$variant"
            local package="$PACKAGE_BASE"
            if [[ "$variant" == combined ]]; then
              package+="-instantmesh2d"
            fi
            package+="$EXTENSION"

            cmake -S /source -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS=-D_GLIBCXX_USE_CXX11_ABI=0 \
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
              '-DCMAKE_INSTALL_RPATH=$ORIGIN' \
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,--disable-new-dtags \
              -DUSE_MESH=ON \
              "-DUSE_INSTANTMESH2D=$instant" \
              -DOCCT_ROOT=/deps/occt \
              -DNETGEN_DIR=/deps/netgen \
              "-DBUILDNO:STRING=26.11.$GITHUB_RUN_NUMBER" \
              "${static_args[@]}"
            cmake --build "$build" --parallel --target geomtool

            if [[ "$STATIC_BUILD" == true ]]; then
              "$python_bin" /source/tests/e2e.py \
                --exe "$build/geomtool" --work "/work/e2e-$variant" --mesh
            else
              LD_LIBRARY_PATH=/deps/occt/lib:/deps/netgen/lib \
                "$python_bin" /source/tests/e2e.py \
                  --exe "$build/geomtool" --work "/work/e2e-$variant" --mesh
            fi

            package_args=()
            if [[ "$STATIC_BUILD" == true ]]; then
              package_args+=(--static)
            fi
            "$python_bin" /source/scripts/package_release.py \
              --exe "$build/geomtool" \
              --platform linux \
              --occt-root /deps/occt \
              --netgen-dir /deps/netgen \
              --output /work/assets \
              --package-name "$package" \
              "${package_args[@]}"
            "$python_bin" /source/scripts/verify_package.py \
              --archive "/work/assets/$package" \
              --work "/work/verify-$variant" \
              --mesh
          }

          build_variant netgen OFF
          build_variant combined ON
          BASH

      - name: Build, package, and qualify Windows/macOS variants
        if: matrix.platform != 'linux'
        shell: bash
        env:
          OCCT_ROOT: ${{ steps.sdk.outputs.occt_root }}
          NETGEN_DIR: ${{ steps.sdk.outputs.netgen_dir }}
          PACKAGE_BASE: ${{ matrix.package_base }}
          EXTENSION: ${{ matrix.extension }}
          STATIC_BUILD: ${{ matrix.static }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          # macOS runners still use Bash 3.2, where an empty array expansion
          # trips nounset. Keep fail-fast and pipeline checking without -u.
          set -eo pipefail
          assets="$RUNNER_TEMP/geomtool-native/assets"
          rm -rf "$RUNNER_TEMP/geomtool-native"
          mkdir -p "$assets"

          static_args=()
          if [[ "$STATIC_BUILD" == true ]]; then
            static_args+=(-DSTATIC=ON)
          fi
          rpath_args=()
          if [[ "$TARGET_PLATFORM" == macos && "$STATIC_BUILD" != true ]]; then
            rpath_args+=(
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
              '-DCMAKE_INSTALL_RPATH=@loader_path'
            )
          fi

          build_variant() {
            local variant="$1"
            local instant="$2"
            local build="$RUNNER_TEMP/geomtool-native/build-$variant"
            local package="$PACKAGE_BASE"
            if [[ "$variant" == combined ]]; then
              package+="-instantmesh2d"
            fi
            package+="$EXTENSION"

            cmake -S . -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_MESH=ON \
              "-DUSE_INSTANTMESH2D=$instant" \
              "-DOCCT_ROOT=$OCCT_ROOT" \
              "-DNETGEN_DIR=$NETGEN_DIR" \
              "-DBUILDNO:STRING=26.11.$GITHUB_RUN_NUMBER" \
              "${static_args[@]}" \
              "${rpath_args[@]}"
            cmake --build "$build" --config Release --parallel --target geomtool
            ctest --test-dir "$build" -C Release --output-on-failure

            if [[ "$TARGET_PLATFORM" == windows ]]; then
              exe="$build/Release/geomtool.exe"
            else
              exe="$build/geomtool"
            fi
            test -f "$exe"

            package_args=()
            if [[ "$STATIC_BUILD" == true ]]; then
              package_args+=(--static)
            fi
            python scripts/package_release.py \
              --exe "$exe" \
              --platform "$TARGET_PLATFORM" \
              --occt-root "$OCCT_ROOT" \
              --netgen-dir "$NETGEN_DIR" \
              --output "$assets" \
              --package-name "$package" \
              "${package_args[@]}"
            python scripts/verify_package.py \
              --archive "$assets/$package" \
              --work "$RUNNER_TEMP/geomtool-native/verify-$variant" \
              --mesh
          }

          build_variant netgen OFF
          build_variant combined ON

      - name: Upload qualified packages
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/geomtool-native/assets/*
          if-no-files-found: error
          retention-days: 14
