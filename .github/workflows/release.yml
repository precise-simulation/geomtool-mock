name: Test Geomtool release publication

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mock-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    uses: ./.github/workflows/native-release.yml

  publish:
    name: Publish qualified test prerelease
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Validate release candidate and artifact set
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/globals.hpp").read_text(encoding="utf-8")
          match = re.search(r'^#define VERSION "([^"]+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("src/globals.hpp lacks the VERSION definition")
          print(match.group(1))
          PY
          )"
          tag="test-v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "test releases must run from main" >&2
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract_path = Path(".github/native-release-matrix.json")
          asset_dir = Path("release-assets")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          expected_packages = set()
          for entry in contract["include"]:
              base = entry["package_base"]
              extension = entry["extension"]
              expected_packages.add(f"{base}{extension}")
              expected_packages.add(f"{base}-instantmesh2d{extension}")

          expected_files = expected_packages | {
              f"{package}.sha256" for package in expected_packages
          }
          actual_files = {path.name for path in asset_dir.iterdir() if path.is_file()}
          if actual_files != expected_files:
              missing = sorted(expected_files - actual_files)
              extra = sorted(actual_files - expected_files)
              raise SystemExit(
                  "release artifacts do not match the native release contract; "
                  f"missing={missing}, extra={extra}"
              )

          for package in sorted(expected_packages):
              archive = asset_dir / package
              sidecar = asset_dir / f"{package}.sha256"
              if archive.stat().st_size == 0 or sidecar.stat().st_size == 0:
                  raise SystemExit(f"empty release artifact: {package}")
              fields = sidecar.read_text(encoding="ascii").split()
              if len(fields) < 2 or fields[1] != package:
                  raise SystemExit(f"invalid checksum sidecar: {sidecar.name}")
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual != fields[0]:
                  raise SystemExit(f"SHA-256 mismatch for {package}")
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create test release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          tag_exists=true
          if ! gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=false
          fi
          if [[ "$tag_exists" == false ]]; then
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          resolve_tag_commit() {
            local object_type object_sha object_json
            object_json="$(
              gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            )"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            while [[ "$object_type" == tag ]]; do
              object_json="$(
                gh api "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              )"
              object_type="$(jq -r '.object.type' <<<"$object_json")"
              object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            done
            [[ "$object_type" == commit ]] || {
              echo "unsupported tag object type: $object_type" >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          remote_tag_sha="$(resolve_tag_commit)"
          if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG resolves to $remote_tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Test release $RELEASE_TAG already exists; refusing to replace its assets" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Geomtool mock test $RELEASE_VERSION ($GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" \
            --generate-notes \
            --prerelease \
            --latest=false \
            --draft

      - name: Verify uploaded draft and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,assets)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]]
          local_names="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$local_names" == "$remote_names" ]] || {
            echo "draft release assets differ from qualified packages" >&2
            exit 1
          }
          mkdir -p release-verify
          gh release download "$RELEASE_TAG" --dir release-verify
          for source in release-assets/*; do
            cmp "$source" "release-verify/$(basename "$source")"
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
