name: Test Geomtool release publication

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mock-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    uses: ./.github/workflows/native-release.yml

  publish:
    name: Publish qualified test prerelease
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Validate release candidate and artifact set
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/globals.hpp").read_text(encoding="utf-8")
          match = re.search(r'^#define VERSION "([^"]+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("src/globals.hpp lacks the VERSION definition")
          print(match.group(1))
          PY
          )"
          tag="test-v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "test releases must run from main" >&2
            exit 1
          fi

          expected=(
            geomtool-win64-msvc-occt8.0.1-netgen6.2.2608.zip
            geomtool-win64-msvc-occt8.0.1-netgen6.2.2608-instantmesh2d.zip
            geomtool-linux-x86_64-glibc2.17-gcc10-occt8.0.1-netgen6.2.2608.tar.gz
            geomtool-linux-x86_64-glibc2.17-gcc10-occt8.0.1-netgen6.2.2608-instantmesh2d.tar.gz
            geomtool-macos13-x86_64-occt8.0.1-netgen6.2.2608.tar.gz
            geomtool-macos13-x86_64-occt8.0.1-netgen6.2.2608-instantmesh2d.tar.gz
            geomtool-macos13-arm64-occt8.0.1-netgen6.2.2608.tar.gz
            geomtool-macos13-arm64-occt8.0.1-netgen6.2.2608-instantmesh2d.tar.gz
            geomtool-linux-x86_64-glibc2.17-gcc10-occt8.0.1-netgen6.2.2608-static.tar.gz
            geomtool-linux-x86_64-glibc2.17-gcc10-occt8.0.1-netgen6.2.2608-static-instantmesh2d.tar.gz
            geomtool-macos13-x86_64-occt8.0.1-netgen6.2.2608-static.tar.gz
            geomtool-macos13-x86_64-occt8.0.1-netgen6.2.2608-static-instantmesh2d.tar.gz
            geomtool-macos13-arm64-occt8.0.1-netgen6.2.2608-static.tar.gz
            geomtool-macos13-arm64-occt8.0.1-netgen6.2.2608-static-instantmesh2d.tar.gz
          )
          expected_files=()
          for package in "${expected[@]}"; do
            expected_files+=("$package" "$package.sha256")
            test -s "release-assets/$package"
            test -s "release-assets/$package.sha256"
            (
              cd release-assets
              sha256sum -c "$package.sha256"
            )
          done
          mapfile -t actual_files < <(find release-assets -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t expected_files < <(printf '%s\n' "${expected_files[@]}" | sort)
          if [[ "${actual_files[*]}" != "${expected_files[*]}" ]]; then
            echo "release artifacts do not match the expected 14 packages and sidecars" >&2
            diff -u <(printf '%s\n' "${expected_files[@]}") <(printf '%s\n' "${actual_files[@]}") || true
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create test release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          tag_exists=true
          if ! gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=false
          fi
          if [[ "$tag_exists" == false ]]; then
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          resolve_tag_commit() {
            local object_type object_sha object_json
            object_json="$(
              gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            )"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            while [[ "$object_type" == tag ]]; do
              object_json="$(
                gh api "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              )"
              object_type="$(jq -r '.object.type' <<<"$object_json")"
              object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            done
            [[ "$object_type" == commit ]] || {
              echo "unsupported tag object type: $object_type" >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          remote_tag_sha="$(resolve_tag_commit)"
          if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG resolves to $remote_tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Test release $RELEASE_TAG already exists; refusing to replace its assets" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Geomtool mock test $RELEASE_VERSION ($GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" \
            --generate-notes \
            --prerelease \
            --latest=false \
            --draft

      - name: Verify uploaded draft and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,assets)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]]
          local_names="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$local_names" == "$remote_names" ]] || {
            echo "draft release assets differ from qualified packages" >&2
            exit 1
          }
          mkdir -p release-verify
          gh release download "$RELEASE_TAG" --dir release-verify
          for source in release-assets/*; do
            cmp "$source" "release-verify/$(basename "$source")"
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
